<figure class="lks-swim" aria-labelledby="swim-cap">

    <text class="lks-swim-svg__lane-label" style="fill:var(--lks-ink)" x="14" y="261">Asklepios</text>

    <text class="lks-swim-svg__lane-label" style="fill:var(--lks-ink)" x="14" y="297">Harburg</text>

      <path d="M412 165H438"/>
      <path d="M496 137V55H738"/>

      <text x="933" y="272" text-anchor="middle"><tspan font-weight="700">6 Abklärung</tspan><tspan x="933" dy="16">Weiterbehandlung</tspan></text>

  <ul class="lks-legend" aria-hidden="true">
    <li class="lks-lane-praxis">Zuweisende Praxis</li>
    <li class="lks-lane-dammtor">Radiologie Dammtor</li>
    <li class="lks-lane-harburg">Asklepios Klinikum Harburg</li>
  </ul>
  <ol class="lks-swim__list">
    <li class="lks-lane-praxis"><span class="lks-swim__lane">Zuweisende Praxis</span><span><strong>Beratung, Bericht und Überweisung</strong> mit dem Auftrag „Lungenkrebsfrüherkennung“</span></li>
    <li class="lks-lane-dammtor"><span class="lks-swim__lane">Radiologie Dammtor</span><span><strong>Terminvergabe</strong> (telefonisch oder online über Doctolib) <strong>und Niedrigdosis-CT</strong> (LDCT)</span></li>
    <li class="lks-lane-dammtor"><span class="lks-swim__lane">Radiologie Dammtor</span><span><strong>Erstbefund</strong> – bei unauffälligem Ergebnis direkt weiter zu Schritt 5</span></li>
    <li class="lks-lane-harburg"><span class="lks-swim__lane">Asklepios Klinikum Harburg</span><span>Bei kontroll- oder abklärungsbedürftigem Erstbefund: <strong>unabhängige Zweitbefundung</strong>, danach gemeinsames Ergebnis (Konsens)</span></li>
    <li class="lks-lane-praxis"><span class="lks-swim__lane">Zuweisende Praxis</span><span><strong>Strukturierter Befund</strong> mit Handlungsempfehlung geht an die zuweisende Praxis</span></li>
    <li class="lks-lane-harburg"><span class="lks-swim__lane">Asklepios Klinikum Harburg</span><span>Bei abklärungsbedürftigem Befund: Beratung der Patientin/des Patienten durch die Erstbefunderin/den Erstbefunder, dann <strong>Abklärung und Weiterbehandlung im Asklepios Klinikum Harburg</strong></span></li>
  </ol>
